---
# ================================================
# playbook.yml - Deploy Docker + Flask Container
# ================================================

- name: Deploy Docker + Flask Container on EC2
  hosts: ec2
  become: true
  gather_facts: true

  vars:
    # Konfigurasi User
    docker_user: ubuntu

    # Konfigurasi Flask App
    flask_image: seizenz/flask-app:latest
    container_name: flask-app
    host_port: 80
    container_port: 5000
    health_endpoint: /health

  tasks:
    # ================================================
    # Section 0: Update apt cache
    # ================================================
    - name: Update apt package index (apt update)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [apt, update]

    # ================================================
    # Section 1: Setup Docker Repository
    # ================================================
    - name: Create /etc/apt/keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker official apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true
      tags: [apt, update]

    # ================================================
    # Section 2: Install Docker CE
    # ================================================
    - name: Install Docker CE packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      tags: [docker, install]

    # ================================================
    # Section 3: Start & Enable Docker service
    # ================================================
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
      tags: [docker, service]

    # ================================================
    # Section 4: Docker Group & User Configuration
    # ================================================
    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present
      tags: [docker, group]

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      tags: [docker, user]

    # ================================================
    # Section 5: Deploy Flask Container
    # ================================================
    - name: Pull Flask image
      community.docker.docker_image:
        name: "{{ flask_image }}"
        source: pull
      tags: [flask, pull]

    - name: Run Flask container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ flask_image }}"
        state: started
        restart_policy: always
        ports:
          - "{{ host_port }}:{{ container_port }}"
      tags: [flask, run]

    # ================================================
    # Section 6: Verifications
    # ================================================
    - name: Verify Docker installation
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      tags: [docker, verify]

    - name: Print Docker verification result
      ansible.builtin.debug:
        msg: "✅ Docker berhasil terinstall: {{ docker_version.stdout }}"

    - name: Verify Flask container status
      community.docker.docker_container_info:
        name: "{{ container_name }}"
      register: flask_container_info
      tags: [flask, verify]

    - name: Print Flask container status
      ansible.builtin.debug:
        msg: |
          ✅ Flask Container Status:
          Name: {{ flask_container_info.container.Name }}
          Status: {{ flask_container_info.container.State.Status }}
          Running: {{ flask_container_info.container.State.Running }}

    - name: Test Flask health endpoint
      ansible.builtin.uri:
        url: "http://localhost{{ health_endpoint }}"
        method: GET
        return_content: true
        timeout: 10
      register: health_check
      tags: [flask, health]
      
    - name: Print Flask health check result
      ansible.builtin.debug:
        msg: "✅ Flask Health Check: {{ health_check.status }}"
